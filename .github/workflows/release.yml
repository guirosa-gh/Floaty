name: Build Floaty app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (for example 1.0)"
        required: true
        default: "1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Floaty.app
        run: bash build.sh

      - name: Make it work on both Apple Silicon and Intel Macs
        run: |
          swiftc -parse-as-library -O -target arm64-apple-macos12 Floaty.swift -o Floaty-arm64
          swiftc -parse-as-library -O -target x86_64-apple-macos12 Floaty.swift -o Floaty-x86_64
          lipo -create Floaty-arm64 Floaty-x86_64 -output Floaty.app/Contents/MacOS/Floaty
          codesign --force --sign - Floaty.app

      - name: Zip it
        run: ditto -c -k --keepParent Floaty.app Floaty.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" Floaty.zip \
            --repo "${{ github.repository }}" \
            --title "Floaty ${{ inputs.version }}" \
            --notes "Download **Floaty.zip**, unzip it, and drag **Floaty** into your Applications folder. Works on Apple Silicon and Intel Macs running macOS 12 or later."
